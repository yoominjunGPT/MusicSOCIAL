<style>

html{scroll-padding-top:env(safe-area-inset-top,0px);background:#000;overflow-x:hidden;overscroll-behavior:none;scroll-behavior:smooth;touch-action:pan-x pan-y}body{overflow-x:clip;max-width:100vw;touch-action:pan-x pan-y}main{min-width:0}

.lbl{display:none}nav button{position:relative;padding:16px 2px;justify-content:center;gap:0}nav button svg{display:block;width:26px;height:26px}nav button::after{content:"";position:absolute;left:50%;bottom:6px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:transparent}nav button[aria-current=true]::after{background:var(--ac)}
.brand{display:none}

nav button svg{width:20px;height:20px}.lbl{display:inline}nav button::after,nav button[aria-current=true]::after{display:none}
nav button[aria-current=true]{background:rgba(10,132,255,.16)}

.seg{display:inline-flex;gap:2px;padding:2px;margin:0 8px 14px 0;border-radius:10px;background:var(--card);max-width:100%;overflow-x:auto}

.row{display:flex;align-items:center;gap:12px;padding:10px 0;position:relative}

.img{width:44px;height:44px;border-radius:10px;flex:none;display:grid;place-items:center;font-weight:600;color:#fff;font-size:16px}
.img.lg{width:64px;height:64px;border-radius:50%;font-size:22px}
.img{overflow:hidden}.img svg{display:block;width:100%;height:100%}
.pod{display:flex;gap:10px;align-items:flex-end;margin-bottom:12px}.pod>div{min-width:0;padding:0}.rb{position:absolute;top:8px;left:8px;z-index:1;min-width:24px;height:24px;padding:0 7px;border-radius:99px;font-weight:700;font-size:13px;line-height:24px;text-align:center;background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:#fff}.pod>.board:nth-child(2) .rb{background:var(--ac)}.board .t{z-index:1}.pn{font-weight:600;font-size:14px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:keep-all}
.board{position:relative;aspect-ratio:1/1;border-radius:24px;overflow:hidden;background:var(--card);color:#fff}.board .img{position:absolute;inset:0;width:100%!important;height:100%!important;border-radius:0!important;margin:0!important}.board .lb{position:absolute;top:14px;left:14px;padding:4px 12px;border-radius:99px;font-size:12px;font-weight:600;background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}.board .t{position:absolute;left:0;right:0;bottom:0;padding:64px 18px 18px;background:linear-gradient(transparent,rgba(0,0,0,.72))}.bn{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.15}.bc{font-size:14px;opacity:.85;margin-top:2px}
.board .lb{padding:7px 11px;line-height:0}.lb svg{display:block;width:20px;height:20px;fill:var(--warn);stroke:var(--warn);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.rep{position:relative;overflow:hidden}.rep>.img{position:absolute;inset:0;width:100%!important;height:100%!important;border-radius:0!important;margin:0!important}.rs{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.18) 35%,rgba(0,0,0,.55) 70%,rgba(0,0,0,.85) 100%)}.rc{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:20px;min-height:560px}.rm{font-size:13px;opacity:.85}.rv{font-size:18px;font-weight:700;letter-spacing:-.02em}
.hs{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;scrollbar-width:thin}.hs:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:12px}
#splash{position:fixed;inset:0;z-index:99;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .7s ease,visibility .7s}#splash.done{opacity:0;visibility:hidden}.sp-brand{font-size:28px;font-weight:700;letter-spacing:-.03em}.sp-bar{width:120px;height:3px;border-radius:99px;background:var(--card2);overflow:hidden}.sp-bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .35s ease}.sp-msg{font-size:13px;color:var(--mu);min-height:20px}#main.in{animation:fin .7s ease both}@keyframes fin{from{opacity:0}to{opacity:1}}@media(prefers-reduced-motion:reduce){#main.in{animation:none}}

svg text{fill:var(--mu);font-size:10px}
.donut{width:136px;height:136px;border-radius:50%;flex:none;position:relative}
.donut::after{content:"";position:absolute;inset:30px;border-radius:50%;background:var(--card)}
.leg{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.leg ul{padding:0}
.leg li{list-style:none;font-size:14px;display:flex;gap:8px;align-items:center;padding:2px 0}
.sw{width:10px;height:10px;border-radius:50%}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center;margin:12px 0 16px}
.vs .n{font-size:40px;font-weight:700;letter-spacing:-.03em}
.win{color:var(--ok)}
.badge{display:inline-flex;align-items:center;padding:6px 13px;border-radius:99px;background:rgba(10,132,255,.16);color:#64b5ff;font-size:13px;font-weight:500;margin:0 6px 6px 0}
.badge.off{background:var(--card2);color:var(--mu)}
.day{font-size:13px;font-weight:600;color:var(--mu);padding:18px 0 4px}
.rep{max-width:360px;margin:0 auto;background:linear-gradient(155deg,#0a84ff,#5e5ce6 55%,#bf5af2);border-radius:28px;padding:28px 26px;color:#fff;box-shadow:0 20px 50px rgba(94,92,230,.3)}
.rep .big{font-size:54px}
.rep .up{color:#fff;opacity:.9}
.btn{background:var(--ac);color:#fff;font-weight:600;padding:12px 24px;border-radius:99px}
.toast{margin-top:12px;color:var(--ok);font-size:13px;min-height:20px}
.sync{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}.sync .grow{min-width:200px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:8px;background:var(--ok)}.dot.late{background:var(--warn)}.dot.off{background:var(--mu)}.btn.sm{padding:8px 18px;font-size:14px}.btn[disabled]{opacity:.4;cursor:default}.pv{margin:0 0 4px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
body.out nav{display:none!important}
.auth{min-height:calc(100vh - 140px);max-width:400px;margin:0 auto;display:flex;flex-direction:column;justify-content:center}
.auth .brand-lg{font-size:30px;font-weight:800;letter-spacing:-.03em;margin-bottom:4px}
.auth .seg{display:flex;margin:4px 0 16px}.auth .seg button{flex:1}
.auth form{display:flex;flex-direction:column;gap:12px}
.auth label{font-size:13px;color:var(--mu);display:block;margin-bottom:4px}
.auth input{width:100%;padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid transparent}
.auth input:focus-visible{outline:none;border-color:var(--ac)}
.auth .err{color:var(--bad);font-size:13px;min-height:20px}
.auth .btn{width:100%;margin-top:2px}
.btn.ghost{background:var(--card2)}
.dot.bad{background:var(--bad)}
.btn.sp{background:#1db954;color:#000;display:flex;align-items:center;justify-content:center;gap:10px}
</style>
</head>
<body>
<div id="splash" role="status" aria-label="로딩 중"><div class="sp-brand">Music Social</div><div class="sp-bar"><i id="spbar"></i></div><div class="sp-msg" id="spmsg" aria-live="polite">준비 중</div></div>
<div class="app">
<nav id="nav" aria-label="주요 메뉴"><div class="brand">Music Social</div></nav>
<main id="main"></main>
</div>
<script>
const COL=['#0a84ff','#bf5af2','#64d2ff','#ff6482','#8e8e93'];
const PERIOD={'전체':1,'최근 3개월':.55,'최근 1개월':.2};
const fmt=n=>n.toLocaleString('ko-KR');
const S={tab:'dash',per:'전체',kind:'곡',bat:'battle',prof:'info',q:'',stat:'일간',shared:'',sync:'ok',user:null,authMode:'in',err:''};
const TABS=[['dash','대시보드','<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>'],['rank','랭킹','<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>'],['stat','통계','<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l6-6 4 4 8-9"/><path d="M15 6h6v6"/></svg>'],['battle','배틀','<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16M16 4l4 4-4 4M20 16H4M8 12l-4 4 4 4"/></svg>'],['prof','프로필','<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>'],['rep','리포트','<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>']];
const seg=(items,key,cur)=>`<div class="seg" role="group">${items.map(x=>`<button data-k="${key}" data-v="${x}" aria-pressed="${cur===x}">${x}</button>`).join('')}</div>`;
const cover=(n,sz=44)=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;const a=h,b=(h+50)%360,k=h%3,id='c'+h;const sh=k===0?'<circle cx="22" cy="22" r="12" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2.5"/><circle cx="22" cy="22" r="3" fill="#fff"/>':k===1?'<path d="M-4 34L34 -4M4 46L46 4" stroke="rgba(255,255,255,.4)" stroke-width="6"/>':'<path d="M0 30Q11 14 22 26T44 18V44H0Z" fill="rgba(255,255,255,.3)"/>';return `<div class="img" aria-hidden="true" style="width:${sz}px;height:${sz}px;${sz>60?'margin:10px 0 4px;border-radius:16px;':''}"><svg viewBox="0 0 44 44" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${a} 75% 55%)"/><stop offset="1" stop-color="hsl(${b} 70% 32%)"/></linearGradient></defs><rect width="44" height="44" fill="url(#${id})"/>${sh}</svg></div>`};
const img=(t,i)=>`<div class="img" style="background:${COL[i%4]}" aria-hidden="true">${t}</div>`;
const podium=(L,sub)=>{const hh=[210,186,162],fs=[16,14,13];return `<div class="pod">${[1,0,2].filter(i=>L[i]).map(i=>{const r=L[i];return `<div class="board" style="flex:1;aspect-ratio:auto;height:${hh[i]}px">${cover(r[0],96)}<span class="rb">${i+1}</span><div class="t" style="padding:40px 10px 10px"><div class="pn" style="font-size:${fs[i]}px;color:#fff">${esc(r[0])}</div><div class="bc">${fmt(r[sub?2:1])}회</div></div></div>`}).join('')}</div>`};
const podiumOld=(L,sub)=>{const z=[88,70,54];return `<div class="pod">${[1,0,2].filter(i=>L[i]).map(i=>{const r=L[i];return `<div style="${i===0?'box-shadow:inset 0 0 0 1.5px rgba(10,132,255,.65)':''}"><div class="rk" style="width:auto;color:${i===0?'var(--ac)':'var(--mu)'};font-size:${i===0?22:17}px">${i+1}</div><div style="display:flex;justify-content:center;margin:6px 0 8px">${cover(r[0],z[i])}</div><div class="pn">${r[0]}</div>${sub?`<div class="mu" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r[1]}</div>`:''}<div class="cnt" style="font-size:14px;margin-top:2px">${fmt(r[sub?2:1])}회</div></div>`}).join('')}</div>`};
const rows=(list,sub,o=0)=>list.map((r,i)=>`<div class="row"><div class="rk">${i+1+o}</div>${cover(r[0])}<div class="grow"><div class="nm">${r[0]}</div>${sub?`<div class="mu">${r[1]}</div>`:''}</div><div class="cnt">${fmt(r[sub?2:1])}회</div></div>`).join('');
function bars(data,h=120){const w=300,m=Math.max(...data),bw=w/data.length;
return `<svg viewBox="0 0 ${w} ${h+16}" width="100%" role="img" aria-label="청취 횟수 막대 그래프. 최대 ${m}회">${[0,.5,1].map(f=>`<line x1="0" x2="${w}" y1="${h-h*f}" y2="${h-h*f}" stroke="#38383a" stroke-width=".6"/>`).join('')}${data.map((v,i)=>`<rect x="${i*bw+1}" y="${h-v/m*h}" width="${bw-2}" height="${v/m*h}" rx="2" fill="#0a84ff"><title>${i+1}번째: ${v}회</title></rect>`).join('')}<text x="0" y="${h+12}">처음</text><text x="${w}" y="${h+12}" text-anchor="end">최근</text></svg>`}
function donut(){const tot=ARTISTS.reduce((a,b)=>a+b[1],0);let acc=0;
const g=ARTISTS.map((a,i)=>{const s=acc/tot*100;acc+=a[1];return `${COL[i%5]} ${s}% ${acc/tot*100}%`}).join(',');
return `<div class="leg"><div class="donut" style="background:conic-gradient(${g})" role="img" aria-label="아티스트별 청취 비중"></div><ul>${ARTISTS.map((a,i)=>`<li><span class="sw" style="background:${COL[i%5]}"></span>${a[0]} <b>${(a[1]/tot*100).toFixed(1)}%</b></li>`).join('')}</ul></div>`}
/* Spotify 로그인 (Authorization Code + PKCE, 서버 불필요)
   1) https://developer.spotify.com/dashboard 에서 앱을 만들고 Client ID를 아래에 넣으세요.
   2) 앱 설정의 Redirect URIs에 이 페이지의 주소(예: https://내도메인/index.html 또는 http://127.0.0.1:5500/index.html)를 정확히 등록하세요.
   ※ file:// 로 직접 열면 로그인할 수 없습니다. */
const SPOTIFY_CLIENT_ID='YOUR_SPOTIFY_CLIENT_ID';
const SP_REDIRECT=location.origin+location.pathname;
const SP_SCOPES='user-read-recently-played user-top-read';
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store=(()=>{const mem={};return{get(k){try{return localStorage.getItem(k)}catch(e){return mem[k]??null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}},del(k){try{localStorage.removeItem(k)}catch(e){delete mem[k]}}}})();
const b64u=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const rndStr=n=>b64u(crypto.getRandomValues(new Uint8Array(n)));
async function spLogin(){
if(SPOTIFY_CLIENT_ID.startsWith('YOUR_'))throw new Error('코드 상단의 SPOTIFY_CLIENT_ID를 먼저 설정해 주세요.');
if(!(window.crypto&&crypto.subtle))throw new Error('https 또는 127.0.0.1 주소에서 열어 주세요.');
const v=rndStr(64),st=rndStr(16),ch=b64u(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
store.set('ms_pkce',JSON.stringify({v,st}));
location.href='https://accounts.spotify.com/authorize?'+new URLSearchParams({response_type:'code',client_id:SPOTIFY_CLIENT_ID,scope:SP_SCOPES,redirect_uri:SP_REDIRECT,state:st,code_challenge_method:'S256',code_challenge:ch})}
async function spToken(body){
const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:SPOTIFY_CLIENT_ID,...body})});
const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error_description||'Spotify 인증에 실패했습니다.');
const old=JSON.parse(store.get('ms_tok')||'{}');
store.set('ms_tok',JSON.stringify({access:j.access_token,refresh:j.refresh_token||old.refresh,exp:Date.now()+j.expires_in*1000-30000}))}
async function spAccess(){const t=JSON.parse(store.get('ms_tok')||'null');if(!t)return null;
if(Date.now()>=t.exp){if(!t.refresh)return null;await spToken({grant_type:'refresh_token',refresh_token:t.refresh});return JSON.parse(store.get('ms_tok')).access}
return t.access}
async function spMe(){const a=await spAccess();if(!a)return null;
const r=await fetch('https://api.spotify.com/v1/me',{headers:{Authorization:'Bearer '+a}});if(!r.ok)return null;const j=await r.json();
const u={id:j.id,name:j.display_name||j.id,img:(j.images&&j.images[0]&&j.images[0].url)||''};store.set('ms_user',JSON.stringify(u));return u}
function spLogout(){['ms_tok','ms_user','ms_pkce'].forEach(k=>store.del(k));S.user=null;DB=null;PLAYS=[];S.imp='';S.sync='ok'}
async function initAuth(){const q=new URLSearchParams(location.search);
if(q.has('code')||q.has('error')){const p=JSON.parse(store.get('ms_pkce')||'null');store.del('ms_pkce');history.replaceState(null,'',location.pathname);
try{if(q.get('error'))throw new Error('Spotify 로그인이 취소되었습니다.');
if(!p||q.get('state')!==p.st)throw new Error('로그인 요청이 올바르지 않습니다. 다시 시도해 주세요.');
await spToken({grant_type:'authorization_code',code:q.get('code'),redirect_uri:SP_REDIRECT,code_verifier:p.v});
S.user=await spMe();if(!S.user)throw new Error('프로필을 불러오지 못했습니다.')}
catch(e){spLogout();S.err=e.message}
return}
try{S.user=JSON.parse(store.get('ms_user')||'null');if(S.user&&!(await spAccess()))throw 0}catch(e){spLogout()}}
let PLAYS=[],DB=null;
const idb=()=>DB||(DB=new Promise((res,rej)=>{const o=indexedDB.open('ms_'+S.user.id,1);o.onupgradeneeded=()=>o.result.createObjectStore('plays',{autoIncrement:true});o.onsuccess=()=>res(o.result);o.onerror=()=>rej(o.error)}));
async function loadPlays(){try{const d=await idb();PLAYS=await new Promise((res,rej)=>{const q=d.transaction('plays').objectStore('plays').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});PLAYS.sort((a,b)=>b.t-a.t)}catch(e){PLAYS=[]}}
async function addPlays(list){const seen=new Map();for(const p of PLAYS){if(!seen.has(p.u))seen.set(p.u,[]);seen.get(p.u).push(p.t)}
const fresh=list.filter(p=>p.t&&!(seen.get(p.u)||[]).some(t=>Math.abs(t-p.t)<180000));if(!fresh.length)return 0;
try{const d=await idb();await new Promise((res,rej)=>{const tx=d.transaction('plays','readwrite'),st=tx.objectStore('plays');fresh.forEach(p=>st.add(p));tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}catch(e){}
for(const p of fresh)PLAYS.push(p);PLAYS.sort((a,b)=>b.t-a.t);return fresh.length}
async function sync(){if(S.sync==='load'||!S.user)return;S.sync='load';if(S.tab==='dash')render();
try{const a=await spAccess();if(!a)throw 0;const r=await fetch('https://api.spotify.com/v1/me/player/recently-played?limit=50',{headers:{Authorization:'Bearer '+a}});if(!r.ok)throw 0;
const j=await r.json();await addPlays((j.items||[]).map(i=>({t:Date.parse(i.played_at),u:i.track.uri,n:i.track.name,a:(i.track.artists[0]||{}).name||'',b:(i.track.album||{}).name||''})));
store.set('ms_last',Date.now());S.sync='ok'}catch(e){S.sync='err'}
if(S.user)render()}
async function importFiles(files){S.imp='가져오는 중…';render();let add=0;
try{for(const f of files){const arr=JSON.parse(await f.text());if(!Array.isArray(arr))throw 0;
add+=await addPlays(arr.filter(x=>x.master_metadata_track_name&&x.spotify_track_uri&&(x.ms_played||0)>=30000).map(x=>({t:Date.parse(x.ts),u:x.spotify_track_uri,n:x.master_metadata_track_name,a:x.master_metadata_album_artist_name||'',b:x.master_metadata_album_album_name||''})))}
S.imp=`${fmt(add)}회의 기록을 추가했습니다.`}catch(e){S.imp='파일을 읽지 못했습니다. Streaming_History_Audio 파일(.json)인지 확인해 주세요.'}
render()}
function bindSync(){const rf=document.getElementById('refresh');if(rf)rf.onclick=sync;
const b=document.getElementById('impbtn'),f=document.getElementById('impfile');if(b&&f){b.onclick=()=>f.click();f.onchange=()=>{if(f.files.length)importFiles([...f.files])}}}
function syncCard(){const m={ok:['','동기화 완료'],load:['','동기화 중'],err:['bad','동기화에 실패했습니다']}[S.sync],t=+store.get('ms_last');
return `<div class="card sync"><div class="grow"><div class="nm"><span class="dot ${m[0]}"></span>${m[1]}</div><div class="mu">마지막 갱신 ${t?new Date(t).toLocaleString('ko-KR',{month:'long',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}):'없음'}</div></div><button class="btn sm" id="refresh" ${S.sync==='load'?'disabled':''}>지금 새로고침</button></div>`}
function importCard(){return `<div class="card" style="margin-bottom:12px"><h2>이전 청취 기록</h2><p class="mu" style="margin-bottom:12px">Spotify에서 받은 확장 스트리밍 기록(Streaming_History_Audio_*.json)을 선택하면 연동 이전 기록도 함께 집계됩니다. · 저장된 기록 ${fmt(PLAYS.length)}회</p><button class="btn sm ghost" id="impbtn" type="button">파일 선택</button><input type="file" id="impfile" accept=".json,application/json" multiple hidden>${S.imp?`<div class="mu" style="margin-top:8px" role="status">${esc(S.imp)}</div>`:''}</div>`}
function agg(kind,per){const lim=per==='전체'?0:Date.now()-(per==='최근 3개월'?91:30)*864e5,m=new Map();
for(const p of PLAYS){if(p.t<lim)continue;if(kind!=='곡'&&!(kind==='아티스트'?p.a:p.b))continue;
const k=kind==='곡'?p.u:kind==='아티스트'?p.a:p.b+'\u0000'+p.a,e=m.get(k);if(e)e[kind==='아티스트'?1:2]++;else m.set(k,kind==='곡'?[p.n,p.a,1]:kind==='아티스트'?[p.a,1]:[p.b,p.a,1])}
const c=kind==='아티스트'?1:2;return [...m.values()].sort((a,b)=>b[c]-a[c])}
function tlList(){const q=S.q.trim().toLowerCase();let day='',out='',n=0;
for(const p of PLAYS){if(q&&!(p.n+' '+p.a).toLowerCase().includes(q))continue;const d=new Date(p.t),dl=d.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'});
if(dl!==day){day=dl;out+=`<div class="day">${esc(dl)}</div>`}
out+=`<div class="row"><span class="mu">${d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false})}</span><div class="grow"><div class="nm">${esc(p.n)}</div><div class="mu">${esc(p.a)}</div></div></div>`;if(++n>=200)break}
return out}
function authView(){return `<div class="auth"><div class="brand-lg">Music Social</div><p class="sub">Spotify 계정으로 로그인하고 내 음악 활동을 확인하세요</p><button class="btn sp" id="splogin" type="button"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#000"/><path d="M6.5 9.3c3.8-1.1 8.2-.8 11.3 1M7 12.6c3.2-.9 6.7-.6 9.4.9M7.6 15.6c2.6-.7 5.2-.4 7.3.8" fill="none" stroke="#1db954" stroke-width="1.7" stroke-linecap="round"/></svg>Spotify로 로그인</button><div class="err" id="autherr" role="alert">${esc(S.err)}</div></div>`}
function bindAuth(){const b=document.getElementById('splogin');
if(b)b.onclick=async()=>{b.disabled=true;try{await spLogin()}catch(e){S.err=e.message;document.getElementById('autherr').textContent=e.message;b.disabled=false}};
const lo=document.getElementById('logout');
if(lo)lo.onclick=()=>{spLogout();Object.assign(S,{tab:'dash',per:'전체',kind:'곡',bat:'battle',prof:'info',q:'',stat:'일간',err:''});render();scrollTo(0,0)}}
const V={
dash(){return `<h1>대시보드</h1><p class="sub">내 음악 활동 요약</p>${syncCard()}${importCard()}`},
rank(){const L=agg(S.kind,S.per).slice(0,50),sb=S.kind!=='아티스트';
return `<h1>청취 랭킹</h1><p class="sub">기간: ${S.per}</p>${seg(['곡','아티스트','앨범'],'kind',S.kind)}${seg(Object.keys(PERIOD),'per',S.per)}${L.length?podium(L,sb)+(L.length>3?`<div class="mu" style="margin:4px 0 8px">4위부터 · 옆으로 밀어서 보기</div><div class="hs" tabindex="0" role="region" aria-label="4위 이후 순위">${L.slice(3).map((r,i)=>`<div class="board" style="flex:none;width:140px;scroll-snap-align:start">${cover(r[0],96)}<span class="rb">${i+4}</span><div class="t" style="padding:40px 10px 10px"><div class="pn" style="font-size:14px;color:#fff">${esc(r[0])}</div><div class="bc">${fmt(r[sb?2:1])}회</div></div></div>`).join('')}</div>`:''):''}`},
stat(){const u={일간:'일',주간:'주',월간:'월'}[S.stat];return `<h1>청취 통계</h1><p class="sub">${S.stat} 청취 횟수 · 단위: 회/${u}</p>${seg(['일간','주간','월간'],'stat',S.stat)}`},
battle(){return `<h1>배틀 · 비교</h1><p class="sub">친구와 청취 횟수로 겨뤄 보세요.</p>${seg2(['battle','compare'],['청취 배틀','사용자 비교'],'bat',S.bat)}`},
prof(){const tabs=seg2(['info','tl'],['프로필','타임라인'],'prof',S.prof);
if(S.prof==='tl')return `<h1>청취 기록 타임라인</h1><p class="sub">곡·아티스트로 검색</p>${tabs}<input id="q" value="${esc(S.q)}" placeholder="곡 또는 아티스트 검색" aria-label="검색" style="width:100%;padding:10px 14px;border-radius:12px;background:var(--card);color:var(--tx);font:inherit;margin-bottom:8px;border:0">${tlList()}`;
const av=S.user.img?`<div class="img lg" aria-hidden="true"><img src="${esc(S.user.img)}" alt="" style="width:100%;height:100%;object-fit:cover"></div>`:img(esc([...S.user.name][0]||'나'),1).replace('class="img"','class="img lg"');
return `<h1>프로필</h1><p class="sub">공개 범위: 친구에게만</p>${tabs}<div class="card" style="display:flex;gap:14px;align-items:center;margin-bottom:12px">${av}<div class="grow"><div class="nm" style="font-weight:700;font-size:18px">${esc(S.user.name)}</div><div class="mu">Spotify 연결됨</div></div><button class="btn sm ghost" id="logout">로그아웃</button></div>`},
rep(){return `<h1>월간 리포트</h1><p class="sub">월간 청취 결산</p>`}
};
function seg2(vals,labels,key,cur){return `<div class="seg" role="group">${vals.map((v,i)=>`<button data-k="${key}" data-v="${v}" aria-pressed="${cur===v}">${labels[i]}</button>`).join('')}</div>`}
function render(){document.body.classList.toggle('out',!S.user);
document.getElementById('nav').innerHTML=!S.user?'':'<div class="brand">Music Social</div>'+TABS.map(t=>`<button data-tab="${t[0]}" aria-label="${t[1]}" aria-current="${S.tab===t[0]}"><span class="i" aria-hidden="true">${t[2]}</span><span class="lbl">${t[1]}</span></button>`).join('');
document.getElementById('main').innerHTML=S.user?V[S.tab]():authView();bindAuth();bindSync();
const q=document.getElementById('q');if(q)q.addEventListener('input',e=>{S.q=e.target.value;const c=e.target.selectionStart;render();const n=document.getElementById('q');n.focus();n.setSelectionRange(c,c)})}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.tab){S.tab=b.dataset.tab;S.shared='';render();scrollTo({top:0,behavior:'smooth'})}
else if(b.dataset.k){if(b.dataset.k==='authMode')S.err='';S[b.dataset.k]=b.dataset.v;render()}});
window.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});['gesturestart','gesturechange'].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));
/* 상·하단 끝에서 고무줄처럼 늘어났다가 부드럽게 돌아오는 효과 */
(()=>{if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
const el=document.getElementById('main');let y=0,sy=0,acc=0,tm;
const top=()=>scrollY<=0,bot=()=>scrollY+innerHeight>=document.documentElement.scrollHeight-1;
const rb=d=>{const k=Math.min(innerHeight,640)*.45;return Math.sign(d)*k*(1-1/(Math.abs(d)*.55/k+1))};
const set=(v,a)=>{y=v;el.style.transition=a?'transform .7s cubic-bezier(.2,.9,.25,1)':'none';el.style.transform=v?`translate3d(0,${v}px,0)`:''};
addEventListener('touchstart',e=>{sy=e.touches[0].clientY;if(y)set(y,false)},{passive:true});
addEventListener('touchmove',e=>{const dy=e.touches[0].clientY-sy;if(e.cancelable&&((dy>0&&top())||(dy<0&&bot()))){e.preventDefault();set(rb(dy),false)}else{sy=e.touches[0].clientY;if(y)set(0,true)}},{passive:false});
addEventListener('touchend',()=>{if(y)set(0,true)});
addEventListener('touchcancel',()=>{if(y)set(0,true)});
addEventListener('wheel',e=>{if(e.ctrlKey)return;const d=e.deltaY;if((d<0&&top())||(d>0&&bot())){e.preventDefault();acc=Math.max(-500,Math.min(500,acc-d));set(rb(acc),false);clearTimeout(tm);tm=setTimeout(()=>{acc=0;set(0,true)},90)}else if(y){acc=0;set(0,true)}},{passive:false});})();
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function prefetch(){const bar=document.getElementById('spbar'),msg=document.getElementById('spmsg');
msg.textContent='계정 확인 중';bar.style.transition='width 450ms linear';bar.style.width='70%';
await Promise.all([initAuth().then(()=>S.user&&loadPlays()),wait(450)]);
bar.style.width='100%';msg.textContent='완료';await wait(300)}
prefetch().catch(()=>{}).finally(()=>{render();document.getElementById('main').classList.add('in');document.getElementById('splash').classList.add('done');if(S.user)sync()});
</script>
</body>
</html>
