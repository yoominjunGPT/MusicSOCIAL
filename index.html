<div id="splash" role="status" aria-label="로딩 중"><div class="sp-brand">Music Social</div><div class="sp-bar"><i id="spbar"></i></div><div class="sp-msg" id="spmsg" aria-live="polite">준비 중</div></div>

<script>
const COL=['#0a84ff','#bf5af2','#64d2ff','#ff6482','#8e8e93'];
const PERIOD={'전체':1,'최근 3개월':.55,'최근 1개월':.2};
const fmt=n=>n.toLocaleString('ko-KR');
const S={np:null,tab:'dash',per:'전체',kind:'곡',prof:'info',q:'',stat:'일간',rmo:'이번 달',shared:'',sync:'ok',user:null,authMode:'in',err:''};
const TABS=[['dash','대시보드','<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>'],['rank','랭킹','<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>'],['stat','통계','<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l6-6 4 4 8-9"/><path d="M15 6h6v6"/></svg>'],['prof','프로필','<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>'],['rep','리포트','<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>']];
const seg=(items,key,cur)=>`<div class="seg" role="group">${items.map(x=>`<button data-k="${key}" data-v="${x}" aria-pressed="${cur===x}">${x}</button>`).join('')}</div>`;
const cover=(n,sz=44)=>`<div class="img" aria-hidden="true" style="width:${sz}px;height:${sz}px;background:#000;${sz>60?'margin:10px 0 4px;border-radius:16px;':''}"></div>`;
const collage=(ks,ov)=>{const u=ks.map(k=>imgOf(k)).filter(Boolean).slice(0,4);if(!u.length)return '';const g=u.length>=4?'repeat(2,1fr) / repeat(2,1fr)':`1fr / repeat(${u.length},1fr)`;return `<div class="bg" style="position:absolute;inset:0;overflow:hidden"><div style="position:absolute;inset:0;display:grid;grid-template:${g};background:#000">${u.map(x=>`<div style="background:#000 url('${esc(x)}') center/cover"></div>`).join('')}</div><div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.2),rgba(0,0,0,${ov}))"></div></div>`};
const recentAlbums=n=>{const s=new Set(),o=[];for(const p of PLAYS){if(!p.b)continue;const k=p.b+SEP+p.a;if(s.has(k))continue;s.add(k);o.push('b:'+k);if(o.length>=n)break}return o};
const COLC=new Map();
function albumColor(u){if(!u)return Promise.resolve('');if(COLC.has(u))return Promise.resolve(COLC.get(u));
return new Promise(res=>{const i=new Image(),t=setTimeout(()=>res(''),6000);i.crossOrigin='anonymous';i.referrerPolicy='no-referrer';
i.onload=()=>{clearTimeout(t);let c='';try{const cv2=document.createElement('canvas');cv2.width=cv2.height=24;const x=cv2.getContext('2d');x.drawImage(i,0,0,24,24);const d=x.getImageData(0,0,24,24).data;let R=0,G=0,B=0,W=0;
for(let k=0;k<d.length;k+=4){const a=d[k],b=d[k+1],e=d[k+2],mx=Math.max(a,b,e),mn=Math.min(a,b,e),sat=mx?(mx-mn)/mx:0,w=sat*sat*(mx/255)+.01;R+=a*w;G+=b*w;B+=e*w;W+=w}
R/=W;G/=W;B/=W;const f=255/(Math.max(R,G,B)||1);c=`rgb(${Math.round(R*f)},${Math.round(G*f)},${Math.round(B*f)})`}catch(e){}COLC.set(u,c);res(c)};
i.onerror=()=>{clearTimeout(t);res('')};i.src=u})}
const artistUrl=n=>{const p=PLAYS.find(x=>x.a===n&&x.artistId),id=p?p.artistId:AID[n];return id?'https://open.spotify.com/artist/'+id:'https://open.spotify.com/search/'+encodeURIComponent(n)};
const npBg=()=>S.np&&S.np.img&&S.np.st!=='none'&&S.np.st!=='err'&&S.np.st!=='scope'?`background:#000 url('${S.np.img}') center/cover`:'';
const img=(t,i)=>`<div class="img" style="background:${COL[i%4]}" aria-hidden="true">${t}</div>`;

const hr=Array(24).fill(0);for(const p of PLAYS)hr[new Date(p.t).getHours()]++;const th=hr.indexOf(Math.max(...hr)),hl=(th<12?'오전 ':'오후 ')+(th%12||12)+'시',sc=(l,v,sb)=>`<div class="card"><div class="mu">${l}</div><div class="big">${v}</div><div class="mu">${esc(sb)}</div></div>`;

return `<h1>청취 랭킹</h1><p class="sub">기간: ${S.per}</p><div class="ctl">${seg(['곡','아티스트','앨범'],'kind',S.kind)}${seg(Object.keys(PERIOD),'per',S.per).replace('class="seg"','class="seg end"')}</div>${r1?`<div class="board top1"${pl(r1)}><span class="tag2 cr" role="img" aria-label="1위">${crown}</span>${cv(keyOf(S.kind,r1),r1[0],96)}<div class="t" style="padding:64px 18px 18px"><div class="pn" style="font-size:26px;color:#fff">${esc(r1[0])}</div><div class="bc nm" style="font-size:14px">${sb?esc(r1[1])+' · ':''}${cn(r1,sb)}</div></div></div>`+(L.length>1?`<div class="mu" style="margin:4px 0 8px">2위부터 · 목록을 스크롤해서 보기</div><div class="card rl" tabindex="0" role="region" aria-label="2위 이후 순위">${L.slice(1).map((r,i)=>`<div class="row"${pl(r)}><div class="rk">${i+2}</div>${cv(keyOf(S.kind,r),r[0],44)}<div class="grow"><div class="nm">${esc(r[0])}</div>${sb?`<div class="mu nm">${esc(r[1])}</div>`:''}</div><div class="cnt">${cn(r,sb)}</div></div>`).join('')}</div>`:''):'<div class="card"><div class="mu">아직 청취 기록이 없습니다.</div></div>'}`},
stat(){const u={일간:'일',주간:'주',월간:'월'}[S.stat],D=statData(S.stat),tot=D.reduce((a,b)=>a+b.n,0),mx=D.reduce((a,b)=>b.n>a.n?b:a,D[0]),span=D.length+({일간:'일',주간:'주',월간:'개월'}[S.stat]);
const sc=(l,v,sb)=>`<div class="card"><div class="mu">${l}</div><div class="big">${v}</div><div class="mu">${esc(sb)}</div></div>`;
return `<h1>청취 통계</h1><p class="sub">청취 횟수 추이</p><div class="ctl">${seg(['일간','주간','월간'],'stat',S.stat)}</div><div class="sm3">${sc('합계',fmt(tot),'최근 '+span)}${sc('평균',fmt(Math.round(tot/D.length)),'회/'+u)}${sc('최다',fmt(mx.n),mx.label)}</div><div class="card"><div class="ch"><h2>${S.stat} 청취 횟수</h2><span class="mu">단위: 회/${u}</span></div>${tot?statBars(D):'<div class="mu">아직 청취 기록이 없습니다. 대시보드에서 새로고침하면 쌓입니다.</div>'}</div>`},
prof(){const tabs=seg2(['info','tl'],['프로필','타임라인'],'prof',S.prof);
if(S.prof==='tl')return `<h1>청취 기록 타임라인</h1><p class="sub">곡·아티스트로 검색</p>${tabs}<input id="q" value="${esc(S.q)}" placeholder="곡 또는 아티스트 검색" aria-label="검색" style="width:100%;padding:10px 14px;border-radius:12px;background:var(--card);color:var(--tx);font:inherit;margin-bottom:8px;border:0">${tlList()}`;
const ms=msAgg().slice(0,8),t0=+store.get('ms_since_'+S.user.id),since=t0?new Date(t0).toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'}):'';
return `<h1>프로필</h1><p class="sub">내 청취 기록과 아티스트 배지</p>${tabs}<div class="card" style="display:flex;gap:14px;align-items:center;margin-bottom:12px">${avatar(S.user,1)}<div class="grow"><div class="nm" style="font-weight:700;font-size:18px">${esc(S.user.name)}</div><div class="mu">총 청취 ${fmt(PLAYS.length)}회 · Spotify 연결됨</div></div><button class="btn sm ghost" id="logout">로그아웃</button></div>
<div class="card"><h2>마일스톤 배지</h2>${ms.length?ms.map((r,i)=>badgeRow(r,i)).join(''):'<div class="mu">청취 기록이 쌓이면 아티스트별 배지가 생깁니다.</div>'}</div>`},
rep(){const o=S.rmo==='이번 달'?0:1,M=monthData(o),P=monthData(o+1),d=M.total-P.total,top=M.songs[0],ta=M.artists[0];
const hero=`<div class="rep" style="max-width:none;margin:0 0 12px">${top?collage(['t:'+top[3]],.66):''}<div class="mu" style="color:#fff;opacity:.85">${esc(M.label)}</div><div class="big">${fmt(M.total)}회</div><div class="up">${P.total?`${esc(P.label)} ${fmt(P.total)}회 대비 ${d>=0?'+':'−'}${fmt(Math.abs(d))}회${o===0?' (진행 중)':''}`:'비교할 이전 달 기록이 없습니다'}</div>${M.total?`<div style="display:flex;gap:22px;margin-top:18px;flex-wrap:wrap"><div><div class="rm">1위 곡</div><div class="rv">${esc(top[0])}</div></div><div><div class="rm">1위 아티스트</div><div class="rv">${esc(ta[0])}</div></div>${M.best?`<div><div class="rm">가장 많이 들은 날</div><div class="rv">${M.best[0]}일 · ${fmt(M.best[1])}회</div></div>`:''}</div>`:''}</div>`;

};
function seg2(vals,labels,key,cur){return `<div class="seg" role="group">${vals.map((v,i)=>`<button data-k="${key}" data-v="${v}" aria-pressed="${cur===v}">${labels[i]}</button>`).join('')}</div>`}
function render(){document.body.classList.toggle('out',!S.user);
document.getElementById('nav').innerHTML=!S.user?'':'<div class="brand">Music Social</div>'+TABS.map(t=>`<button data-tab="${t[0]}" aria-label="${t[1]}" aria-current="${S.tab===t[0]}"><span class="i" aria-hidden="true">${t[2]}</span><span class="lbl">${t[1]}</span></button>`).join('');
document.getElementById('main').innerHTML=S.user?V[S.tab]():authView();bindAuth();bindSync();if(S.user){if(S.tab==='dash')pollNP();warm();marquee()}
const q=document.getElementById('q');if(q)q.addEventListener('input',e=>{S.q=e.target.value;const c=e.target.selectionStart;render();const n=document.getElementById('q');n.focus();n.setSelectionRange(c,c)})}
function openSp(v){const n=S.np,u=v&&v!=='np'?v:n&&n.url||'https://open.spotify.com',w=window.open(u,'_blank');if(w){try{w.opener=null}catch(e){}}else location.href=u}
document.addEventListener('click',e=>{const op=e.target.closest('[data-open]');if(op&&!e.target.closest('button')){openSp(op.dataset.open);return}const pl=e.target.closest('[data-play]');if(pl&&!e.target.closest('button')){playCmd(pl.dataset.play);return}
const b=e.target.closest('button');if(!b)return;
if(b.dataset.tab){S.tab=b.dataset.tab;S.shared='';render();scrollTo({top:0,behavior:'smooth'})}
else if(b.dataset.k){if(b.dataset.k==='authMode')S.err='';S[b.dataset.k]=b.dataset.v;render()}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches){if(e.target.matches('[data-open]')){e.preventDefault();openSp(e.target.dataset.open)}else if(e.target.matches('[data-play]')){e.preventDefault();playCmd(e.target.dataset.play)}}});
window.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});['gesturestart','gesturechange'].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));
/* 터치: Safari 기본 고무줄 바운스 사용 / 마우스 휠(데스크톱): 아래 커스텀 효과 */
(()=>{if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
const el=document.getElementById('main');let y=0,sy=0,acc=0,tm;
const top=()=>scrollY<=0,bot=()=>scrollY+innerHeight>=document.documentElement.scrollHeight-1;
const inL=(t,up)=>{const l=t&&t.closest&&t.closest('.rl');return !!l&&(up?l.scrollTop>0:l.scrollTop+l.clientHeight<l.scrollHeight-1)};const rb=d=>{const k=Math.min(innerHeight,640)*.45;return Math.sign(d)*k*(1-1/(Math.abs(d)*.55/k+1))};
const set=(v,a)=>{y=v;el.style.transition=a?'transform .7s cubic-bezier(.2,.9,.25,1)':'none';el.style.transform=v?`translate3d(0,${v}px,0)`:''};
addEventListener('wheel',e=>{if(e.ctrlKey)return;const d=e.deltaY;if(!inL(e.target,d<0)&&((d<0&&top())||(d>0&&bot()))){e.preventDefault();acc=Math.max(-500,Math.min(500,acc-d));set(rb(acc),false);clearTimeout(tm);tm=setTimeout(()=>{acc=0;set(0,true)},90)}else if(y){acc=0;set(0,true)}},{passive:false});})();
function marquee(root){root=root||document;const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
root.querySelectorAll('.nm,.pn,.bc').forEach(el=>{let sp=el.firstElementChild&&el.firstElementChild.classList.contains('mqi')?el.firstElementChild:null;
if(!sp){if(el.children.length)return;sp=document.createElement('span');sp.className='mqi';sp.textContent=el.textContent;el.textContent='';el.appendChild(sp)}
sp.style.animation='';el.classList.remove('mqa');const d=Math.ceil(sp.offsetWidth-el.clientWidth);
if(d>2&&!rm){el.classList.add('mqa');sp.style.setProperty('--mqd',-d-2+'px');sp.style.animation=`mq ${Math.max(7,d/18+5).toFixed(1)}s ease-in-out infinite`}})}
let mqT=0;addEventListener('resize',()=>{clearTimeout(mqT);mqT=setTimeout(()=>marquee(),200)});
