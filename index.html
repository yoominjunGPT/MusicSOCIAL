dash(){return `<h1>대시보드</h1><p class="sub">내 음악 활동 요약</p>${note}${syncCard()}
<div class="grid g2"><div class="card"><div class="mu">이번 달 총 청취</div><div class="big" style="font-size:44px;padding:6px 0">1,284회</div><div class="up">전월 대비 +8.4%</div><div class="mu" style="margin-top:4px">지난달 1,184회</div></div><div class="card"><div class="mu">다음 마일스톤</div><div class="big" style="font-size:26px;padding:10px 0 12px">하늘달 1,000회</div><div class="bar"><i style="width:64.5%"></i></div><div class="mu" style="margin-top:8px">645회 달성 · 355회 남음</div></div></div>
<div class="grid g2" style="margin-top:12px"><div class="board">${cover('night owl club',96)}<span class="lb" role="img" aria-label="1위 아티스트"><svg viewBox="0 0 24 24"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-1.8 10H4.8z"/><path d="M5 21h14"/></svg></span><div class="t"><div class="bn">night owl club</div><div class="bc">812회 · 29.4%</div></div></div><div class="board">${cover('Static Bloom',96)}<span class="lb" role="img" aria-label="1위 곡"><svg viewBox="0 0 24 24"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-1.8 10H4.8z"/><path d="M5 21h14"/></svg></span><div class="t"><div class="bn">Static Bloom</div><div class="bc">night owl club · 148회</div></div></div></div>
<div class="grid g2" style="margin-top:12px"><div class="card"><h2>상위 곡</h2>${rows(SONGS.slice(0,3),true)}</div><div class="card"><h2>상위 아티스트</h2>${rows(ARTISTS.slice(0,3),false)}</div></div>`},
rank(){const L=S.kind==='곡'?SONGS:S.kind==='아티스트'?ARTISTS.slice(0,5):ALBUMS;const f=PERIOD[S.per];
const sc=L.map(r=>{const c=[...r];const i=r.length-1;c[i]=Math.round(r[i]*f);return c});
return `<h1>청취 랭킹</h1><p class="sub">기간: ${S.per}</p>${note}${seg(['곡','아티스트','앨범'],'kind',S.kind)}${seg(Object.keys(PERIOD),'per',S.per)}${podium(sc,S.kind!=='아티스트')}${sc.length>3?`<div class="mu" style="margin:4px 0 8px">4위부터 · 옆으로 밀어서 보기</div><div class="hs" tabindex="0" role="region" aria-label="4위 이후 순위">${sc.slice(3).map((r,i)=>`<div class="board" style="flex:none;width:140px;scroll-snap-align:start">${cover(r[0],96)}<span class="rb">${i+4}</span><div class="t" style="padding:40px 10px 10px"><div class="pn" style="font-size:14px;color:#fff">${r[0]}</div><div class="bc">${fmt(r[S.kind!=='아티스트'?2:1])}회</div></div></div>`).join('')}</div>`:''}`},
stat(){const d=S.stat==='일간'?DAILY:S.stat==='주간'?[212,240,198,261]:[812,901,1184,1284];const u={일간:'일',주간:'주',월간:'월'}[S.stat];
return `<h1>청취 통계</h1><p class="sub">${S.stat} 청취 횟수 · 단위: 회/${u}</p>${note}${seg(['일간','주간','월간'],'stat',S.stat)}
<div class="grid g4" style="margin-bottom:12px"><div class="card"><div class="mu">합계</div><div class="big">${fmt(d.reduce((a,b)=>a+b,0))}</div></div><div class="card"><div class="mu">평균</div><div class="big">${Math.round(d.reduce((a,b)=>a+b,0)/d.length)}</div></div><div class="card"><div class="mu">최대</div><div class="big">${Math.max(...d)}</div></div></div>
<div class="card" style="margin-bottom:12px"><h2>청취 추이</h2>${bars(d,140)}</div><div class="card"><h2>아티스트 비중</h2>${donut()}<p class="mu" style="margin-top:10px">전체 청취 중 night owl club이 가장 큰 비중을 차지합니다.</p></div>`},
battle(){const t=S.bat==='battle'?`<div class="card"><h2>진행 중 · Static Bloom 대결</h2><div class="mu">11월 10일 ~ 11월 20일 · 5일 남음</div><div class="vs"><div><div class="mu">나</div><div class="n win">37</div></div><div class="mu">VS</div><div><div class="mu">지우</div><div class="n">29</div></div></div><div class="bar"><i style="width:56%"></i></div><p class="mu" style="margin-top:8px">현재 8회 앞서고 있습니다.</p></div>
<div class="card" style="margin-top:12px"><h2>종료된 대결</h2><div class="row"><div class="grow"><div class="nm">Alex · Marlow Ray</div><div class="mu">10월 · 최종 52 : 61</div></div><span class="dn">패배</span></div><div class="row"><div class="grow"><div class="nm">소연 · 하늘달</div><div class="mu">9월 · 최종 88 : 70</div></div><span class="up">승리</span></div></div>`
:`<div class="card"><h2>나 vs 지우</h2><div class="vs"><div><div class="mu">총 청취</div><div class="n win">2,761</div></div><div class="mu">VS</div><div><div class="mu">총 청취</div><div class="n">2,310</div></div></div><p class="mu">취향 유사도 <b style="color:var(--tx)">68%</b> · 공통 아티스트 3명</p><div class="bar" style="margin:8px 0 14px"><i style="width:68%"></i></div><h2>공통 아티스트</h2>${['night owl club','하늘달','Pale Coast'].map(a=>`<span class="badge">${a}</span>`).join('')}<h2 style="margin-top:10px">나만 많이 듣는 아티스트</h2><span class="badge">Marlow Ray</span><span class="badge">오렌지 라인</span></div>`;
return `<h1>배틀 · 비교</h1><p class="sub">친구와 청취 횟수로 겨뤄 보세요.</p>${note}${seg2(['battle','compare'],['청취 배틀','사용자 비교'],'bat',S.bat)}${t}`},
prof(){const tabs=seg2(['info','tl'],['프로필','타임라인'],'prof',S.prof);
if(S.prof==='tl'){const q=S.q.trim().toLowerCase();return `<h1>청취 기록 타임라인</h1><p class="sub">곡·아티스트로 검색</p>${note}${tabs}<input id="q" value="${S.q}" placeholder="곡 또는 아티스트 검색" aria-label="검색" style="width:100%;padding:10px 14px;border-radius:12px;background:var(--card);color:var(--tx);font:inherit;margin-bottom:8px;border:0">${TL.map(([d,l])=>{const f=l.filter(r=>!q||(r[1]+r[2]).toLowerCase().includes(q));return f.length?`<div class="day">${d}</div>${f.map(r=>`<div class="row"><span class="mu">${r[0]}</span><div class="grow"><div class="nm">${r[1]}</div><div class="mu">${r[2]}</div></div></div>`).join('')}`:''}).join('')||'<p class="mu" style="padding:16px 0">검색 결과가 없습니다.</p>'}`}
return `<h1>프로필</h1><p class="sub">공개 범위: 친구에게만</p>${note}${tabs}<div class="card" style="display:flex;gap:14px;align-items:center;margin-bottom:12px">${img('나',1).replace('class="img"','class="img lg"')}<div><div class="nm" style="font-weight:700;font-size:18px">내 프로필</div><div class="mu">총 청취 2,761회 · 친구 3명</div></div></div>
<div class="card" style="margin-bottom:12px"><h2>마일스톤 배지</h2>${MS.map(([a,c,ts])=>`<div style="margin-bottom:10px"><div class="mu">${a} · ${fmt(c)}회</div>${ts.map(t=>`<span class="badge ${c>=t?'':'off'}">${fmt(t)}회${c>=t?' 달성':' · '+Math.round(c/t*100)+'%'}</span>`).join('')}</div>`).join('')}</div>
<div class="card"><h2>친구</h2>${FRIENDS.map((f,i)=>`<div class="row">${img(f[0][0],i)}<div class="grow"><div class="nm">${f[0]}</div></div><div class="cnt">${f[1]}회/월</div></div>`).join('')}</div>`},
rep(){return `<h1>월간 리포트</h1><p class="sub">2026년 10월 결산</p>${note}<div class="rep">${cover('Afterglow Hours',100)}<div class="rs"></div><div class="rc"><div class="board" style="border-radius:20px">${cover('night owl club',96)}<div class="t"><div class="rm">가장 많이 들은 아티스트</div><div class="bn">night owl club</div><div class="bc">517회</div></div></div><div><div class="rm">총 청취 횟수</div><div class="big">1,184회</div><div class="rm" style="margin-bottom:16px">전월 대비 +9.2%</div><div class="rm">가장 많이 들은 곡</div><div class="rv">Static Bloom · 62회</div><div class="rm" style="margin-top:10px">가장 많이 들은 앨범</div><div class="rv">Afterglow Hours · 164회</div></div></div></div>
<div style="text-align:center;margin-top:16px"><button class="btn" id="share">이미지로 공유</button><div class="toast" id="toast" role="status">${S.shared}</div></div>`}
};
function seg2(vals,labels,key,cur){return `<div class="seg" role="group">${vals.map((v,i)=>`<button data-k="${key}" data-v="${v}" aria-pressed="${cur===v}">${labels[i]}</button>`).join('')}</div>`}
function render(){document.getElementById('nav').innerHTML='<div class="brand">Music Social</div>'+TABS.map(t=>`<button data-tab="${t[0]}" aria-label="${t[1]}" aria-current="${S.tab===t[0]}"><span class="i" aria-hidden="true">${t[2]}</span><span class="lbl">${t[1]}</span></button>`).join('');
document.getElementById('main').innerHTML=V[S.tab]();
const q=document.getElementById('q');if(q){q.addEventListener('input',e=>{S.q=e.target.value;const p=e.target.selectionStart;render();const n=document.getElementById('q');n.focus();n.setSelectionRange(p,p)})}
const rf=document.getElementById('refresh');if(rf)rf.onclick=()=>{S.sync='load';render();setTimeout(()=>{if(S.sync==='load'){S.sync='ok';if(S.tab==='dash')render()}},1200)};const sh=document.getElementById('share');if(sh)sh.onclick=()=>{S.shared='공유용 미리보기 이미지가 준비되었습니다. (프로토타입에서는 저장되지 않습니다)';render()}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.tab){S.tab=b.dataset.tab;S.shared='';render();scrollTo({top:0,behavior:'smooth'})}
else if(b.dataset.k){S[b.dataset.k]=b.dataset.v;render()}});
window.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});['gesturestart','gesturechange'].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));
(()=>{const el=document.getElementById('main');let y=0,sy=0,acc=0,tm;if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
const top=()=>scrollY<=0,bot=()=>scrollY+innerHeight>=document.documentElement.scrollHeight-1,dp=d=>Math.sign(d)*90*(1-Math.exp(-Math.abs(d)/240));
const set=(v,a)=>{y=v;el.style.transition=a?'transform .6s cubic-bezier(.22,1,.36,1)':'none';el.style.transform=v?`translateY(${v}px)`:''};
addEventListener('touchstart',e=>{sy=e.touches[0].clientY;set(y,false)},{passive:true});
addEventListener('touchmove',e=>{const dy=e.touches[0].clientY-sy;if((dy>0&&top())||(dy<0&&bot())){e.preventDefault();set(dp(dy),false)}else{sy=e.touches[0].clientY;if(y)set(0,true)}},{passive:false});
addEventListener('touchend',()=>{if(y)set(0,true)});
addEventListener('wheel',e=>{if(e.ctrlKey)return;const d=e.deltaY;if((d<0&&top())||(d>0&&bot())){e.preventDefault();acc=Math.max(-400,Math.min(400,acc-d));set(dp(acc),false);clearTimeout(tm);tm=setTimeout(()=>{acc=0;set(0,true)},110)}else if(y){acc=0;set(0,true)}},{passive:false});})();
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function prefetch(){const bar=document.getElementById('spbar'),msg=document.getElementById('spmsg');
const steps=[['계정 확인 중',()=>wait(250)],['청취 기록 불러오는 중',()=>wait(350)],['통계 계산 중',()=>{Object.keys(PERIOD).forEach(p=>[SONGS,ALBUMS,ARTISTS].forEach(L=>L.map(r=>Math.round(r[r.length-1]*PERIOD[p]))));return wait(250)}],['커버 이미지 준비 중',()=>{[...SONGS,...ALBUMS,...ARTISTS].forEach(r=>cover(r[0]));return wait(250)}]];
for(let i=0;i<steps.length;i++){msg.textContent=steps[i][0];bar.style.transition='width '+[250,350,250,250][i]+'ms linear';bar.style.width=((i+1)/steps.length*100)+'%';await steps[i][1]()}
bar.style.width='100%';msg.textContent='완료';await wait(350)}
prefetch().catch(()=>{}).finally(()=>{render();document.getElementById('main').classList.add('in');document.getElementById('splash').classList.add('done')});
</script>
</body>
