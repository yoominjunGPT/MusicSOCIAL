<style>

.pa{padding:0;position:relative;flex:none;display:block;overflow:hidden;border-radius:10px}.pa.lg{border-radius:16px}.pa .img{margin:0!important}.pi{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.3)}.pi svg{width:38%;height:38%;fill:#fff}.pa:active .pi{background:rgba(0,0,0,.5)}
.mrow{padding:14px 0}.mrow:first-of-type{padding-top:4px}.mrow+.mrow{border-top:.5px solid var(--line)}.mh{display:flex;gap:12px;align-items:center;margin-bottom:12px}.medals{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}.mm{flex:none;width:48px;height:48px}.mm .ml,.mm .mn{display:none}.mm svg{width:48px;height:48px;display:block;flex:none}.medals svg{width:56px;height:56px;display:block;margin:0 auto}.ml{font-size:12px;font-weight:600;margin-top:2px}.ml.off{color:var(--mu)}.mn{font-size:11px;color:var(--mu)}
.ctl{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.ctl .seg{margin:0}.ctl .seg.end{margin-left:auto}.sm3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.sm3 .big{font-size:26px}
</style>

<div id="splash" role="status" aria-label="로딩 중"><div class="sp-brand">Music Social</div><div class="sp-bar"><i id="spbar"></i></div><div class="sp-msg" id="spmsg" aria-live="polite">준비 중</div></div>

<script>
const COL=['#0a84ff','#bf5af2','#64d2ff','#ff6482','#8e8e93'];
const PERIOD={'전체':1,'최근 3개월':.55,'최근 1개월':.2};
const fmt=n=>n.toLocaleString('ko-KR');
const S={np:null,tab:'dash',per:'전체',kind:'곡',prof:'info',q:'',stat:'일간',rmo:'이번 달',shared:'',sync:'ok',user:null,authMode:'in',err:''};
const TABS=[['dash','대시보드','<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>'],['rank','랭킹','<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>'],['stat','통계','<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l6-6 4 4 8-9"/><path d="M15 6h6v6"/></svg>'],['prof','프로필','<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>'],['rep','리포트','<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>']];
const seg=(items,key,cur)=>`<div class="seg" role="group">${items.map(x=>`<button data-k="${key}" data-v="${x}" aria-pressed="${cur===x}">${x}</button>`).join('')}</div>`;
const cover=(n,sz=44)=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;const a=h,b=(h+50)%360,k=h%3,id='c'+h;const sh=k===0?'<circle cx="22" cy="22" r="12" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2.5"/><circle cx="22" cy="22" r="3" fill="#fff"/>':k===1?'<path d="M-4 34L34 -4M4 46L46 4" stroke="rgba(255,255,255,.4)" stroke-width="6"/>':'<path d="M0 30Q11 14 22 26T44 18V44H0Z" fill="rgba(255,255,255,.3)"/>';return `<div class="img" aria-hidden="true" style="width:${sz}px;height:${sz}px;${sz>60?'margin:10px 0 4px;border-radius:16px;':''}"><svg viewBox="0 0 44 44" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${a} 75% 55%)"/><stop offset="1" stop-color="hsl(${b} 70% 32%)"/></linearGradient></defs><rect width="44" height="44" fill="url(#${id})"/>${sh}</svg></div>`};
const img=(t,i)=>`<div class="img" style="background:${COL[i%4]}" aria-hidden="true">${t}</div>`;
const podium=(L,sub)=>{const hh=[210,186,162],fs=[16,14,13];return `<div class="pod">${[1,0,2].filter(i=>L[i]).map(i=>{const r=L[i];return `<div class="board" style="flex:1;aspect-ratio:auto;height:${hh[i]}px">${cover(r[0],96)}<span class="rb">${i+1}</span><div class="t" style="padding:40px 10px 10px"><div class="pn" style="font-size:${fs[i]}px;color:#fff">${esc(r[0])}</div><div class="bc">${cn(r,sub)}</div></div></div>`}).join('')}</div>`};
const podiumOld=(L,sub)=>{const z=[88,70,54];return `<div class="pod">${[1,0,2].filter(i=>L[i]).map(i=>{const r=L[i];return `<div style="${i===0?'box-shadow:inset 0 0 0 1.5px rgba(10,132,255,.65)':''}"><div class="rk" style="width:auto;color:${i===0?'var(--ac)':'var(--mu)'};font-size:${i===0?22:17}px">${i+1}</div><div style="display:flex;justify-content:center;margin:6px 0 8px">${cover(r[0],z[i])}</div><div class="pn">${r[0]}</div>${sub?`<div class="mu" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r[1]}</div>`:''}<div class="cnt" style="font-size:14px;margin-top:2px">${fmt(r[sub?2:1])}회</div></div>`}).join('')}</div>`};
const rows=(list,sub,o=0)=>list.map((r,i)=>`<div class="row"><div class="rk">${i+1+o}</div>${cover(r[0])}<div class="grow"><div class="nm">${r[0]}</div>${sub?`<div class="mu">${r[1]}</div>`:''}</div><div class="cnt">${fmt(r[sub?2:1])}회</div></div>`).join('');
function bars(data,h=120){const w=300,m=Math.max(...data),bw=w/data.length;
return `<svg viewBox="0 0 ${w} ${h+16}" width="100%" role="img" aria-label="청취 횟수 막대 그래프. 최대 ${m}회">${[0,.5,1].map(f=>`<line x1="0" x2="${w}" y1="${h-h*f}" y2="${h-h*f}" stroke="#38383a" stroke-width=".6"/>`).join('')}${data.map((v,i)=>`<rect x="${i*bw+1}" y="${h-v/m*h}" width="${bw-2}" height="${v/m*h}" rx="2" fill="#0a84ff"><title>${i+1}번째: ${v}회</title></rect>`).join('')}<text x="0" y="${h+12}">처음</text><text x="${w}" y="${h+12}" text-anchor="end">최근</text></svg>`}
function statData(mode){const N={일간:14,주간:12,월간:12}[mode],now=new Date(),d0=new Date(now.getFullYear(),now.getMonth(),now.getDate()),B=[];
for(let i=N-1;i>=0;i--){let st,en,lb;
if(mode==='일간'){st=new Date(d0);st.setDate(st.getDate()-i);en=new Date(st);en.setDate(en.getDate()+1);lb=(st.getMonth()+1)+'/'+st.getDate()}
else if(mode==='주간'){st=new Date(d0);st.setDate(st.getDate()-((st.getDay()+6)%7)-i*7);en=new Date(st);en.setDate(en.getDate()+7);lb=(st.getMonth()+1)+'/'+st.getDate()}
else{st=new Date(now.getFullYear(),now.getMonth()-i,1);en=new Date(st.getFullYear(),st.getMonth()+1,1);lb=(st.getMonth()+1)+'월'}
B.push({s:+st,e:+en,label:lb,n:0})}
for(const p of PLAYS){const b=B.find(x=>p.t>=x.s&&p.t<x.e);if(b)b.n++}return B}
function statBars(D){const w=300,h=120,m=Math.max(...D.map(x=>x.n),1),bw=w/D.length,ev=D.length>12?2:1;

function syncCard(){const m={ok:['','동기화 완료'],load:['','동기화 중'],err:['bad','동기화에 실패했습니다']}[S.sync],t=+store.get('ms_last_'+S.user.id);
return `<div class="card sync"><div class="grow"><div class="nm"><span class="dot ${m[0]}"></span>${m[1]}</div><div class="mu">마지막 갱신 ${t?new Date(t).toLocaleString('ko-KR',{month:'long',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}):'없음'}</div></div><button class="btn sm" id="refresh" ${S.sync==='load'?'disabled':''}>지금 새로고침</button></div>`}
function agg(kind,per){const lim=per==='전체'?0:Date.now()-(per==='최근 3개월'?91:30)*864e5,m=new Map();
for(const p of PLAYS){if(p.t<lim)continue;if(kind!=='곡'&&!(kind==='아티스트'?p.a:p.b))continue;
const k=kind==='곡'?p.u:kind==='아티스트'?p.a:p.b+'\u0000'+p.a,e=m.get(k);if(e)e[kind==='아티스트'?1:2]++;else m.set(k,kind==='곡'?[p.n,p.a,1]:kind==='아티스트'?[p.a,1]:[p.b,p.a,1])}
const c=kind==='아티스트'?1:2;return [...m.values()].sort((a,b)=>b[c]-a[c])}
const cn=(r,sb)=>{const c=r[sb?2:1];return c==null?(sb?esc(r[1]||''):''):fmt(c)+'회'};
function tlList(){const q=S.q.trim().toLowerCase();let day='',out='',n=0;
for(const p of PLAYS){if(q&&!(p.n+' '+p.a).toLowerCase().includes(q))continue;const d=new Date(p.t),dl=d.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'});
if(dl!==day){day=dl;out+=`<div class="day">${esc(dl)}</div>`}
out+=`<div class="row"><span class="mu">${d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false})}</span><div class="grow"><div class="nm">${esc(p.n)}</div><div class="mu">${esc(p.a)}</div></div></div>`;if(++n>=200)break}
return out}
function authView(){return `<div class="auth"><div class="brand-lg">Music Social</div><p class="sub">Spotify 계정으로 로그인하고 내 음악 활동을 확인하세요</p><form id="authform" novalidate><div><label for="cid">Spotify Client ID</label><input id="cid" value="${esc(cid())}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="32자리 Client ID"></div><button class="btn sp" id="splogin" type="submit"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#000"/><path d="M6.5 9.3c3.8-1.1 8.2-.8 11.3 1M7 12.6c3.2-.9 6.7-.6 9.4.9M7.6 15.6c2.6-.7 5.2-.4 7.3.8" fill="none" stroke="#1db954" stroke-width="1.7" stroke-linecap="round"/></svg>Spotify로 로그인</button><div class="err" id="autherr" role="alert">${esc(S.err)}</div></form></div>`}
function bindAuth(){
const af=document.getElementById('authform');if(af)af.onsubmit=async e=>{e.preventDefault();const bt=document.getElementById('splogin');bt.disabled=true;try{await spLogin(document.getElementById('cid').value)}catch(x){S.err=x.message;document.getElementById('autherr').textContent=x.message;bt.disabled=false}};
const lo=document.getElementById('logout');if(lo)lo.onclick=logoutCurrent;
}
const V={
dash(){const T=new Date();T.setHours(0,0,0,0);const today=PLAYS.filter(p=>p.t>=+T).length,ts=agg('곡','전체')[0],ta=agg('아티스트','전체')[0],tu=topUri(ts);
return `<h1>대시보드</h1><p class="sub">내 음악 활동 요약</p><div class="sq"><div class="board" id="np">${npHtml()}</div><div class="board" style="background:linear-gradient(155deg,#0a84ff,#5e5ce6 55%,#bf5af2)"><span class="tag2">오늘 청취</span><div class="t" style="background:none;padding:0 16px 14px"><div class="big" style="font-size:52px">${fmt(today)}<span style="font-size:22px;font-weight:600">회</span></div></div></div>${tile('1위 곡',ts&&ts[0],ts&&esc(ts[1])+' · '+fmt(ts[2])+'회',ts&&imgOf('t:'+tu),tu?`<button type="button" class="pb" data-play="${esc(tu)}" aria-label="이 곡 재생">${PLAY}</button>`:'')}${tile('1위 아티스트',ta&&ta[0],ta&&fmt(ta[1])+'회',ta&&imgOf('a:'+ta[0]))}</div><div class="toast" id="pmsg" role="status" style="margin:-4px 0 12px;min-height:0"></div>${syncCard()}`},
rank(){const sb=S.kind!=='아티스트',L=agg(S.kind,S.per).slice(0,50);
return `<h1>청취 랭킹</h1><p class="sub">기간: ${S.per}</p><div class="ctl">${seg(['곡','아티스트','앨범'],'kind',S.kind)}${seg(Object.keys(PERIOD),'per',S.per).replace('class="seg"','class="seg end"')}</div>${L.length?podium(L,sb)+(L.length>3?`<div class="mu" style="margin:4px 0 8px">4위부터 · 옆으로 밀어서 보기</div><div class="hs" tabindex="0" role="region" aria-label="4위 이후 순위">${L.slice(3).map((r,i)=>`<div class="board" style="flex:none;width:140px;scroll-snap-align:start">${cover(r[0],96)}<span class="rb">${i+4}</span><div class="t" style="padding:40px 10px 10px"><div class="pn" style="font-size:14px;color:#fff">${esc(r[0])}</div><div class="bc">${cn(r,sb)}</div></div></div>`).join('')}</div>`:''):''}`},
stat(){const u={일간:'일',주간:'주',월간:'월'}[S.stat],D=statData(S.stat),tot=D.reduce((a,b)=>a+b.n,0),mx=D.reduce((a,b)=>b.n>a.n?b:a,D[0]);
return `<h1>청취 통계</h1><p class="sub">${S.stat} 청취 횟수 · 단위: 회/${u}</p><div class="ctl">${seg(['일간','주간','월간'],'stat',S.stat)}</div><div class="sm3"><div class="card"><div class="mu">합계</div><div class="big">${fmt(tot)}</div></div><div class="card"><div class="mu">평균/${u}</div><div class="big">${fmt(Math.round(tot/D.length))}</div></div><div class="card"><div class="mu">최다 · ${esc(mx.label)}</div><div class="big">${fmt(mx.n)}</div></div></div><div class="card">${tot?statBars(D):'<div class="mu">아직 청취 기록이 없습니다. 대시보드에서 새로고침하면 쌓입니다.</div>'}</div>`},
prof(){const tabs=seg2(['info','tl'],['프로필','타임라인'],'prof',S.prof);
if(S.prof==='tl')return `<h1>청취 기록 타임라인</h1><p class="sub">곡·아티스트로 검색</p>${tabs}<input id="q" value="${esc(S.q)}" placeholder="곡 또는 아티스트 검색" aria-label="검색" style="width:100%;padding:10px 14px;border-radius:12px;background:var(--card);color:var(--tx);font:inherit;margin-bottom:8px;border:0">${tlList()}`;
const ms=agg('아티스트','전체').slice(0,8),t0=+store.get('ms_since_'+S.user.id),since=t0?new Date(t0).toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'}):'';
return `<h1>프로필</h1><p class="sub">내 청취 기록과 아티스트 배지</p>${tabs}<div class="card" style="display:flex;gap:14px;align-items:center;margin-bottom:12px">${avatar(S.user,1)}<div class="grow"><div class="nm" style="font-weight:700;font-size:18px">${esc(S.user.name)}</div><div class="mu">총 청취 ${fmt(PLAYS.length)}회 · Spotify 연결됨</div></div><button class="btn sm ghost" id="logout">로그아웃</button></div>
<div class="card"><h2>마일스톤 배지</h2>${ms.length?ms.map((r,i)=>badgeRow(r,i)).join(''):'<div class="mu">청취 기록이 쌓이면 아티스트별 배지가 생깁니다.</div>'}</div>`},
rep(){const o=S.rmo==='이번 달'?0:1,M=monthData(o),P=monthData(o+1),d=M.total-P.total,top=M.songs[0],ta=M.artists[0];
const hero=`<div class="rep" style="max-width:none;margin:0 0 12px"><div class="mu" style="color:#fff;opacity:.85">${esc(M.label)}</div><div class="big">${fmt(M.total)}회</div><div class="up">${P.total?`${esc(P.label)} ${fmt(P.total)}회 대비 ${d>=0?'+':'−'}${fmt(Math.abs(d))}회${o===0?' (진행 중)':''}`:'비교할 이전 달 기록이 없습니다'}</div>${M.total?`<div style="display:flex;gap:22px;margin-top:18px;flex-wrap:wrap"><div><div class="rm">1위 곡</div><div class="rv">${esc(top[0])}</div></div><div><div class="rm">1위 아티스트</div><div class="rv">${esc(ta[0])}</div></div><div><div class="rm">들은 날</div><div class="rv">${M.days}일</div></div>${M.best?`<div><div class="rm">가장 많이 들은 날</div><div class="rv">${M.best[0]}일 · ${fmt(M.best[1])}회</div></div>`:''}</div>`:''}</div>`;
return `<h1>월간 리포트</h1><p class="sub">월간 청취 결산</p><div class="ctl">${seg(['이번 달','지난달'],'rmo',S.rmo)}</div>${M.total?hero+`<div class="grid g2"><div class="card"><h2>많이 들은 곡</h2>${rows(M.songs.slice(0,5),true)}</div><div class="card"><h2>많이 들은 아티스트</h2>${rows(M.artists.slice(0,5),false)}</div></div>`:hero+'<div class="card"><div class="mu">이 달의 청취 기록이 없습니다.</div></div>'}`}
};
function seg2(vals,labels,key,cur){return `<div class="seg" role="group">${vals.map((v,i)=>`<button data-k="${key}" data-v="${v}" aria-pressed="${cur===v}">${labels[i]}</button>`).join('')}</div>`}
function render(){document.body.classList.toggle('out',!S.user);
document.getElementById('nav').innerHTML=!S.user?'':'<div class="brand">Music Social</div>'+TABS.map(t=>`<button data-tab="${t[0]}" aria-label="${t[1]}" aria-current="${S.tab===t[0]}"><span class="i" aria-hidden="true">${t[2]}</span><span class="lbl">${t[1]}</span></button>`).join('');
document.getElementById('main').innerHTML=S.user?V[S.tab]():authView();bindAuth();bindSync();if(S.user&&S.tab==='dash'){pollNP();resolveTop()}
const q=document.getElementById('q');if(q)q.addEventListener('input',e=>{S.q=e.target.value;const c=e.target.selectionStart;render();const n=document.getElementById('q');n.focus();n.setSelectionRange(c,c)})}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.tab){S.tab=b.dataset.tab;S.shared='';render();scrollTo({top:0,behavior:'smooth'})}
else if(b.dataset.play){playCmd(b.dataset.play)}
else if(b.dataset.k){if(b.dataset.k==='authMode')S.err='';S[b.dataset.k]=b.dataset.v;render()}});
window.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});['gesturestart','gesturechange'].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));
/* 상·하단 끝에서 고무줄처럼 늘어났다가 부드럽게 돌아오는 효과 */
(()=>{if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
const el=document.getElementById('main');let y=0,sy=0,acc=0,tm;
const top=()=>scrollY<=0,bot=()=>scrollY+innerHeight>=document.documentElement.scrollHeight-1;
const rb=d=>{const k=Math.min(innerHeight,640)*.45;return Math.sign(d)*k*(1-1/(Math.abs(d)*.55/k+1))};
const set=(v,a)=>{y=v;el.style.transition=a?'transform .7s cubic-bezier(.2,.9,.25,1)':'none';el.style.transform=v?`translate3d(0,${v}px,0)`:''};
addEventListener('touchstart',e=>{sy=e.touches[0].clientY;if(y)set(y,false)},{passive:true});
addEventListener('touchmove',e=>{const dy=e.touches[0].clientY-sy;if(e.cancelable&&((dy>0&&top())||(dy<0&&bot()))){e.preventDefault();set(rb(dy),false)}else{sy=e.touches[0].clientY;if(y)set(0,true)}},{passive:false});
addEventListener('touchend',()=>{if(y)set(0,true)});
addEventListener('touchcancel',()=>{if(y)set(0,true)});
addEventListener('wheel',e=>{if(e.ctrlKey)return;const d=e.deltaY;if((d<0&&top())||(d>0&&bot())){e.preventDefault();acc=Math.max(-500,Math.min(500,acc-d));set(rb(acc),false);clearTimeout(tm);tm=setTimeout(()=>{acc=0;set(0,true)},90)}else if(y){acc=0;set(0,true)}},{passive:false});})();
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function prefetch(){if(document.documentElement.classList.contains('noload'))return initAuth();
splash(true);step('계정 확인 중',15);await initAuth();
if(!S.user)return;
await loadAccount();step('완료',100);await wait(1100)}
prefetch().catch(()=>{}).finally(()=>{render();document.getElementById('main').classList.add('in');splash(false)});
</script>
