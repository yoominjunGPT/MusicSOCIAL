/* 로딩 중 모든 앨범·아티스트·곡 사진을 확보한다.
   Spotify의 배치 조회 API 대신 개별 조회 API를 사용한다.
   429는 Retry-After만큼 기다리고, 동시 요청 수를 제한한다. */
const NOIMG=new Set(),IMGFAIL=new Set();
const requestCache=new Map(),requestBusy=new Map();
async function spRequest(path){
 if(requestCache.has(path))return requestCache.get(path);
 if(requestBusy.has(path))return requestBusy.get(path);
 const job=(async()=>{
  let st=0;
  for(let n=0;n<4;n++){
   const tk=await spAccess();if(!tk)return{st:401};
   let r;try{r=await tfetch('https://api.spotify.com/v1'+path,{headers:{Authorization:'Bearer '+tk}})}catch(e){st=-1;if(n<3)await wait(700*(n+1));continue}
   if(r.ok){const out={st:200,j:await r.json()};requestCache.set(path,out);return out}
   st=r.status;
   if(r.status===429){const ra=+r.headers.get('Retry-After')||2;await wait(Math.min(15,ra+1)*1000);continue}
   if(r.status===401){if(n<2){await wait(400);continue}return{st:401}}
   if(r.status===403)return{st:403};
   if(r.status>=500){if(n<3)await wait(700*(n+1));continue}
   const out={st};if(st===404)requestCache.set(path,out);return out
  }
  return{st}
 })();
 requestBusy.set(path,job);
 try{const out=await job;requestCache.set(path,out);return out}finally{requestBusy.delete(path)}
}

async function addPlays(list){

for(const[nm,c]of msAgg())TIERS.forEach((t,i)=>{if(c>=t[0]){const k=nm+'|'+i;cur[k]=1;if(seen&&!seen[k])best.set(nm,Math.max(best.get(nm)??-1,i))}});
store.set(key,JSON.stringify(Object.assign({},seen||{},cur)));
if(!seen||best.size>4)return;
[...best].sort((a,b)=>a[1]-b[1]).forEach(([nm,i])=>showBadge(nm,i,false))}
/* 긴 제목 마퀴: 잠깐 멈춤 → 부드럽게 가속 → 일정 속도 → 감속 → 끊김 없이 반복.
   화면 밖의 항목은 IntersectionObserver로 일시정지해 목록이 길어도 가볍게 동작한다. */
const MQ={io:null,set:new Set(),v:24,hold:2600,gap:'2.4em'};
function mqObs(){if(MQ.io||!('IntersectionObserver' in window))return MQ.io;
MQ.io=new IntersectionObserver(es=>{for(const e of es){const a=e.target._mq;if(!a)continue;if(e.isIntersecting){if(a.playState==='paused')a.play()}else if(a.playState==='running')a.pause()}});return MQ.io}
function marquee(root){root=root||document;const rm=matchMedia('(prefers-reduced-motion:reduce)').matches,io=mqObs();
for(const x of MQ.set)if(!x.isConnected){if(x._mq)x._mq.cancel();io&&io.unobserve(x);MQ.set.delete(x)}
let idx=0;
root.querySelectorAll('.nm,.pn,.bc').forEach(el=>{let sp=el.firstElementChild&&el.firstElementChild.classList.contains('mqi')?el.firstElementChild:null;
if(!sp){if(el.children.length)return;const tx=el.textContent;sp=document.createElement('span');sp.className='mqi';sp.dataset.t=tx;el.textContent='';el.appendChild(sp)}
const tx=sp.dataset.t;
if(el._mq){el._mq.cancel();el._mq=null}
if(MQ.set.has(el)){io&&io.unobserve(el);MQ.set.delete(el)}
el.classList.remove('mqa');sp.textContent=tx;
const cw=el.clientWidth;if(!cw||rm||sp.offsetWidth-cw<=2)return;
/* 같은 글자를 간격을 두고 한 번 더 이어 붙인다. 간격은 공백 문자가 아니라 padding으로 줘서(공백은 nowrap에서 접힘) 정확히 한 주기만큼 이동하면 처음과 완전히 겹친다 */
sp.textContent='';const a=document.createElement('span'),b=document.createElement('span');
a.className=b.className='mqt';a.textContent=b.textContent=tx;a.style.paddingRight=MQ.gap;sp.append(a,b);el.classList.add('mqa');
const per=parseFloat(getComputedStyle(a).width);if(!per)return;
const v=MQ.v,d1=Math.min(18,per*.12),t1=2*d1/v*1000,tc=(per-2*d1)/v*1000,T=MQ.hold+2*t1+tc,X=n=>`translate3d(${-n}px,0,0)`;
el._mq=sp.animate([
{transform:X(0),offset:0},
{transform:X(0),offset:MQ.hold/T,easing:'cubic-bezier(.11,0,.5,0)'},
{transform:X(d1),offset:(MQ.hold+t1)/T},
{transform:X(per-d1),offset:(MQ.hold+t1+tc)/T,easing:'cubic-bezier(.5,1,.89,1)'},
{transform:X(per),offset:1}
],{duration:T,iterations:Infinity,delay:Math.min(idx++,8)*160});
if(io){io.observe(el);MQ.set.add(el)}})}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>marquee());let mqT=0;addEventListener('resize',()=>{clearTimeout(mqT);mqT=setTimeout(()=>marquee(),200)});
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function prefetch(){if(document.documentElement.classList.contains('noload'))return initAuth();
splash(true);step('계정 확인 중',15);await initAuth();
if(!S.user)return;
await loadAccount();step('완료',100);await wait(1100)}
prefetch().catch(()=>{}).finally(()=>{render();document.getElementById('main').classList.add('in');splash(false);BM.ready=true;setTimeout(checkBadges,1400)});
</script>
